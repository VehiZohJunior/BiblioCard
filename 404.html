<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable · SCIENTUS</title>
<meta name="description" content="Cette page de SCIENTUS n’existe pas ou a changé d’adresse.">
<meta name="robots" content="noindex">
<link rel="icon" href="https://vehizohjunior.github.io/BiblioCard/favicon.ico" sizes="any">
<!-- page autonome : l’adresse demandée peut être n’importe où, donc liens et image en adresse complète -->
<style>
:root{--fond:#F7F8FC;--encre:#141A3A;--doux:#4A5170;--action:#5B3BEE;--sur-action:#fff;--carte:#fff;--trait:#DCDFEE}
@media (prefers-color-scheme: dark){:root{--fond:#0E1022;--encre:#EEF0FF;--doux:#B6BBD8;--action:#8E7DFF;--sur-action:#0E1022;--carte:#171A33;--trait:#2B2F52}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--fond);color:var(--encre);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;width:100%;background:var(--carte);border:1px solid var(--trait);border-radius:20px;padding:36px 28px;text-align:center}
img{width:72px;height:72px}
.code{font-size:15px;letter-spacing:.2em;color:var(--doux);margin:14px 0 4px}
h1{font-size:26px;line-height:1.25;margin:0 0 12px}
p{color:var(--doux);margin:0 0 24px}
a.cta{display:inline-block;background:var(--action);color:var(--sur-action);text-decoration:none;font-weight:600;padding:13px 24px;border-radius:999px}
a.cta:focus-visible,a.sec:focus-visible{outline:3px solid var(--action);outline-offset:3px}
a.sec{display:inline-block;margin-top:16px;color:var(--encre)}
</style>
</head>
<body>
<main>
  <img src="https://vehizohjunior.github.io/BiblioCard/logo-c.png" alt="Logo de SCIENTUS">
  <div class="code">ERREUR 404</div>
  <h1>Cette page n’existe pas</h1>
  <p>L’adresse est peut-être mal tapée, ou la page a changé de place. Ton travail, lui, est intact : il reste enregistré sur ton appareil.</p>
  <a class="cta" href="https://vehizohjunior.github.io/BiblioCard/">Ouvrir SCIENTUS</a><br>
  <a class="sec" href="https://vehizohjunior.github.io/BiblioCard/accueil.html">Découvrir SCIENTUS</a>
</main>
</body>
</html>
